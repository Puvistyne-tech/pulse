[workspace]
resolver = "3"
members = ["crates/*", "apps/*/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
pulse-protocol = { path = "crates/pulse-protocol" }
pulse-core = { path = "crates/pulse-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1.29", default-features = false, features = ["std", "v7", "serde", "js"] }
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6.5"
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid"] }
redis = { version = "1.8", features = ["tokio-comp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
futures-util = { version = "0.3", features = ["sink"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30"
rstest = "0.28"
futures = { version = "0.3", features = ["executor"] }
tauri = "2.12"
tauri-build = "2.7"
flutter_rust_bridge = "=2.13.0"
