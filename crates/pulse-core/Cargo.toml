[package]
name = "pulse-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native = ["dep:reqwest", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:rusqlite"]

[dependencies]
pulse-protocol.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
pulse-protocol = { workspace = true, features = ["fixtures"] }
rstest.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[[test]]
name = "native_link"
required-features = ["native"]

[lints]
workspace = true
